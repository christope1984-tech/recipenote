<style>html{background:#130D0D}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>서연이의 레시피노트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: 시작 표지(페이드) → 메뉴 목록 → 메뉴 안에서 '장사 전 밑작업' / '주문 후 조리' 두 단계. 붉은달빛주점 다홍·금빛 */
:root{
  /* 붉은달빛주점 전용 다크 테마 — 휴대폰 밝기 설정과 상관없이 고정 */
  --bg:#130D0D; --surface:#1E1616; --ink:#F0E6E3; --muted:#A8958F; --line:#35282A;
  --accent:#E2665C; --accent-ink:#1A0B0A; --accent-soft:#3A1D1D;
  --ticket:#D7B061; --ticket-ink:#22180A;
  --good:#71D29C; --warn:#E6AE55; --bad:#FF8A65; --good-bg:#183326; --warn-bg:#352a14; --bad-bg:#3d2117;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.35);
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --nav-h:62px;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--nav-h) + 96px);-webkit-tap-highlight-color:transparent;word-break:keep-all}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{text-wrap:balance;margin:0}

/* 시작 표지: 1.5초 보여준 뒤 왼쪽 제본선을 축으로 표지가 넘어가며 첫 장(앱)이 드러남 */
#splash{position:fixed;inset:0;z-index:100;perspective:1800px;perspective-origin:0% 50%;overflow:hidden}
#splash .cast{position:absolute;inset:0;background:linear-gradient(to right,rgba(0,0,0,.55),rgba(0,0,0,.18) 45%,transparent 80%);opacity:0}
#splash .leaf{position:absolute;inset:0;transform-origin:0% 50%;transform-style:preserve-3d;will-change:transform}
#splash .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
#splash .front{background:#0B0606;display:grid;place-items:center}

#splash .sp-bg{position:absolute;inset:-60px;background:#0B0606 var(--splash) center/cover;filter:blur(28px) brightness(.4)}
#splash .sp-img{position:absolute;inset:0;background:var(--splash) center/contain no-repeat;opacity:0;transition:opacity .3s ease}
#splash.ready .sp-img{opacity:1}
#splash .shade{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:linear-gradient(to left,rgba(0,0,0,.65),rgba(0,0,0,.15) 55%,rgba(255,235,200,.12) 85%,transparent)}
#splash .back{transform:rotateY(180deg);background:
  repeating-linear-gradient(45deg,rgba(255,215,150,.05) 0 2px,transparent 2px 9px),
  linear-gradient(to left,#2A0B0C,#5A1418 70%,#3A0E10)}
#splash.turn .leaf{animation:leaf .95s cubic-bezier(.55,.05,.35,1) forwards}
#splash.turn .shade{animation:shade .95s ease-in forwards}
#splash.turn .cast{animation:cast .95s ease-out forwards}
@keyframes leaf{0%{transform:rotateY(0)}12%{transform:rotateY(-6deg) translateZ(4px)}100%{transform:rotateY(-178deg)}}
@keyframes shade{0%{opacity:0}55%{opacity:1}100%{opacity:1}}
@keyframes cast{0%{opacity:1}100%{opacity:0}}
body.booting header.top,body.booting main,body.booting nav.tabs,body.booting .fab{visibility:hidden}

/* 상단 */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg)}
.top-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:8px;min-height:56px;padding-block:8px}
.top-in h1{font-size:20px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:40px;height:40px;border:0;background:transparent;border-radius:10px;display:grid;place-items:center;margin-left:-8px}
.icon-btn svg{width:22px;height:22px}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:500}
.primary-sm{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:7px 16px;font-weight:700}

/* 목록 */
.shop{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.03em;margin:-4px 0 10px}
.notice{background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:12px}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:700;text-decoration:underline}
.today{background:var(--surface);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:12px;display:grid;gap:8px}
.td-top{display:flex;justify-content:space-between;align-items:baseline}
.td-top b{font-size:16px}
.td-top .num{font-size:20px;font-weight:600}
.pbar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .25s}
.today p{margin:0;font-size:12.5px;color:var(--muted)}
.search input{width:100%;height:46px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 14px;font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.cat{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;display:flex;gap:6px;align-items:center}
.cat span{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.cat.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cat.on span{color:var(--bg);opacity:.75}
.list{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.item{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;border:0;background:none;padding:14px 16px}
.item:active{background:var(--accent-soft)}
.chk{flex:none;width:52px;border:0;background:none;display:grid;place-items:center}
.chk span{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.chk svg{width:16px;height:16px}
.chk.on span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.it-main{flex:1;min-width:0}
.it-name{font-weight:700;font-size:16px}
.it-meta{font-size:13px;color:var(--muted)}
.it-meta .over{color:var(--bad);font-weight:500}
.it-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.it-side .num{font-size:15px;font-weight:600}
.chip{font-family:var(--f-num);font-size:12px;font-weight:600;border-radius:6px;padding:1px 7px}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.none{background:var(--bg);color:var(--muted);font-family:var(--f-body);font-weight:500}
.thumb{flex:none;width:52px;height:52px;border-radius:10px;overflow:hidden;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:18px}

/* 상세 */
.ticket{background:var(--ticket);color:var(--ticket-ink);border-radius:14px 14px 4px 4px;padding:16px;position:relative;margin-bottom:22px}
.ticket::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:8px;
  background:radial-gradient(circle at 6px 0,transparent 5px,var(--ticket) 5.5px) 0 0/12px 8px repeat-x}
.tk-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.donebtn{width:100%;height:50px;border-radius:12px;border:2px solid var(--accent);background:var(--surface);color:var(--accent);font-weight:700;font-size:15px;margin-bottom:24px;display:flex;align-items:center;justify-content:center;gap:8px}
.donebtn.on{background:var(--accent);color:var(--accent-ink)}
.donebtn svg{width:18px;height:18px}
.block{margin-bottom:26px}
.bh{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.block h2,form h2{font-size:17px;font-weight:700}
.scale{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:2px}
.scale button{border:0;background:none;padding:5px 10px;border-radius:8px;font-family:var(--f-num);font-size:13px}
.scale button.on{background:var(--accent);color:var(--accent-ink)}
.scale-note{font-size:13px;color:var(--muted);margin-bottom:8px}
.store{display:flex;gap:8px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:18px;font-size:14px}
.store b{flex:none;font-size:12px;color:var(--accent);letter-spacing:.04em}
.ings{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:12px;box-shadow:var(--shadow)}
.ings li{display:grid;grid-template-columns:minmax(0,1fr) auto 86px;gap:10px;align-items:baseline;padding:11px 14px;border-top:1px solid var(--line)}
.ings li:first-child{border-top:0}
.ings li.sum{font-weight:700;background:var(--bg);border-radius:0 0 12px 12px}
.ings .q{font-weight:600;text-align:right}
.ings small{font-family:var(--f-body);font-size:12px;color:var(--muted);margin-left:2px}
.ings .c{text-align:right;color:var(--muted);font-size:13.5px}
.steps{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.steps button{width:100%;display:flex;gap:12px;text-align:left;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.no{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-num);font-size:13px;font-weight:600}
.tx{flex:1;min-width:0}
.tm{flex:none;font-family:var(--f-num);font-size:12.5px;color:var(--muted);text-align:right;line-height:1.35}

.steps .done{opacity:.55}

.hint{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.goal{border-radius:14px;padding:14px 16px;margin-bottom:14px;display:grid;gap:10px;border:1px solid var(--line);background:var(--surface)}

.timer button{border:1px solid currentColor;background:none;color:inherit;border-radius:999px;padding:6px 14px;font-weight:700}
.startbtn{width:100%;height:52px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:8px}

.danger{color:var(--bad)!important}

/* 편집 */
form{display:grid;gap:14px}
.fsec{display:grid;gap:12px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}

.field{display:grid;gap:4px;min-width:0}
.field label,.flabel{font-size:13px;font-weight:500;color:var(--muted)}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px}
textarea{resize:vertical;line-height:1.5}
input[type=number]{font-family:var(--f-num)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.help{font-size:12.5px;color:var(--muted);margin:-4px 0 0}
.live{font-size:13px;color:var(--accent);font-weight:600}
.ing-ed{background:var(--bg);border-radius:12px;padding:10px;display:grid;gap:8px}
.ing-ed .r1{display:grid;grid-template-columns:minmax(0,1fr) 84px 76px 36px;gap:6px}
.ing-ed .r2{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.ing-ed .r2 input{width:96px;padding:7px 9px;font-size:15px}
.ing-ed output{margin-left:auto;font-family:var(--f-num);color:var(--ink);font-weight:600}
.rm{border:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:18px;line-height:1;min-height:40px}
.step-ed{display:grid;grid-template-columns:26px minmax(0,1fr) 36px;gap:8px;align-items:start}
.step-ed.t{grid-template-columns:26px minmax(0,1fr) 64px 36px}
.step-ed .no{margin-top:9px}
.step-ed input{padding:10px 8px;text-align:center}
.add{border:1px dashed var(--line);background:transparent;border-radius:12px;height:44px;color:var(--accent);font-weight:700}
.err{color:var(--bad);font-weight:500;margin:0}
.save-row{display:flex;gap:8px}
.save-row button{flex:1;height:48px;border-radius:12px;font-weight:700;border:1px solid var(--line);background:var(--surface)}
.save-row .primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* 원가표 */
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.sum div{min-width:0;background:var(--surface);border-radius:12px;padding:10px 12px;border:1px solid var(--line)}
.sum b{display:block;font-family:var(--f-num);font-size:20px;font-weight:600}
.sum span{font-size:12px;color:var(--muted);line-height:1.35;display:block}
.clist{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.crow{width:100%;display:grid;gap:8px;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:14px 16px}
.crow:first-child{border-top:0}
.crow:active{background:var(--accent-soft)}
.c-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.c-name{font-weight:700;font-size:16px;min-width:0}
.c-top .chip{font-size:13px;padding:2px 8px;flex:none}
.crow .bar{margin-top:0}
.c-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.c-stats span{min-width:0;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;line-height:1.3}
.c-stats small{display:block;font-family:var(--f-body);font-size:11.5px;font-weight:500;color:var(--muted);margin-bottom:2px}
.c-stats .over{color:var(--bad)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border-radius:12px;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;min-width:460px}
th{font-size:12px;font-weight:500;color:var(--muted);text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:11px 12px;border-top:1px solid var(--line);text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
td:first-child{font-family:var(--f-body);font-weight:500;white-space:normal}
tr[data-act]{cursor:pointer}
tr[data-act]:active{background:var(--accent-soft)}
td .over{color:var(--bad)}
.bar{height:4px;border-radius:2px;background:var(--bg);margin-top:4px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:2px}
.bar.good i{background:var(--good)}.bar.warn i{background:var(--warn)}.bar.bad i{background:var(--bad)}

/* 설정 */
.card{background:var(--surface);border-radius:14px;padding:14px;border:1px solid var(--line);display:grid;gap:12px}
.btn{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:500;display:grid;place-items:center;width:100%}
.btn.fill{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.isteps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.isteps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;font-size:14.5px}
.isteps .no{width:28px;height:28px}
.ico{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--bg);border:1px solid var(--line);vertical-align:-7px;margin:0 2px;color:var(--accent)}
.ico svg{width:16px;height:16px}
.okline{display:flex;gap:10px;align-items:center;font-weight:700;color:var(--good)}
.okline svg{width:22px;height:22px}
.warnbox{font-size:12.5px;color:var(--warn);background:var(--warn-bg);border-radius:10px;padding:9px 12px;margin:0}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* 하단 탭 / FAB / 시트 / 토스트 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--nav-h)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent);font-weight:700}
.fab{position:fixed;z-index:6;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom,0px));
  height:56px;padding:0 20px 0 16px;border:0;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px;display:flex;gap:6px;align-items:center;box-shadow:var(--shadow)}
.fab svg{width:22px;height:22px}
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:18px 18px 0 0;
  padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:10px}
.sheet h3{font-size:18px}
.sheet p{margin:0;color:var(--muted)}
.sh-act{display:flex;gap:8px;margin-top:6px}
.sh-act button{flex:1;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.sh-act .ok{background:var(--bad);color:#fff;border-color:var(--bad)}
.sh-act .ok.safe{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.toast{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 86px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){
  #view{animation:in .18s ease-out}
  @keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
}
@media (prefers-reduced-motion:reduce){#splash.turn .leaf,#splash.turn .shade,#splash.turn .cast{animation:none}#splash.turn{display:none}}
</style>
</head>

</button>

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>원가·시간표</button>

<script>
/* ===== 1. 데이터 =====
   메뉴 하나 = 두 단계
   - 장사 전 밑작업: prepSteps(순서), prepStorage(보관), prepBatch(하루 준비량), 재료 stage:'prep'
   - 주문 후 조리:   serviceSteps[{text,min}], targetMin(목표 서빙 시간), 재료 stage:'service'
   재료량은 모두 1접시 기준 → 밑작업 화면에서 하루 준비량만큼 곱해 보여줌 */
const KEY = 'seoyeonRecipeNote.v3';
const CATS = ['안주','탕·전골','식사','사이드','음료'];
const UNITS = ['g','kg','ml','L','개','장','모','단','봉','팩','큰술','작은술','컵'];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pi = (name, qty, unit, buyQty, buyPrice) => ({ stage:'prep', name, qty, unit, buyQty, buyPrice });
const si = (name, qty, unit, buyQty, buyPrice) => ({ stage:'service', name, qty, unit, buyQty, buyPrice });
const st = (text, min) => ({ text, min });
const M = o => Object.assign({ yieldUnit:'접시', memo:'', updatedAt:'2026-10-22', photo:'sample:' + o.id }, o);

function svcLiveHTML(r) {
  const tm = state.timer && state.timer.id === r.id ? state.timer : null;
  const el = tm ? (Date.now() - tm.start) / 1000 : 0;
  let acc = 0; const bounds = r.serviceSteps.map(s => { const a = acc; acc += n(s.min) * 60; return [a, acc]; });
  const cur = tm ? bounds.findIndex(([a, b]) => el >= a && el < b) : -1;
  const tg = n(r.targetMin) * 60;
  let head;
  if (tm) {
    const fin = cur === -1;
    const late = tg && el > tg;
    head = `<div class="timer ${late ? 'late' : ''}" role="timer">
      <div class="timer-row"><span class="clock">${mmss(el)}<small>${tg ? '/ ' + mmss(tg) : ''}</small></span><button data-act="timerStop">정지</button></div>
      <div class="cur">${fin ? '조리 단계 끝 · 바로 서빙하세요' : `지금 ${cur + 1}단계: ${esc(r.serviceSteps[cur].text)}`}</div>
      ${!fin ? `<div class="nxt">${cur + 1 < r.serviceSteps.length ? `다음 단계까지 ${mmss(bounds[cur][1] - el)}` : `서빙까지 ${mmss(bounds[cur][1] - el)}`}</div>` : ''}
    </div>`;
  } else {
    head = r.serviceSteps.length ? `<button class="startbtn" data-act="timerStart">${PLAY}주문 들어옴 · 타이머 시작</button>` : '';
  }
  return `${head}
  ${r.serviceSteps.length ? `<section class="block"><h2>조리 순서</h2>
    <ol class="steps">${r.serviceSteps.map((s, k) => {
      const key = 's' + k, [a, b] = bounds[k];
      const cl = [state.checked.has(key) ? 'done' : '', k === cur ? 'now' : ''].join(' ');
      return `<li><button class="${cl}" data-act="step" data-k="${key}" aria-pressed="${state.checked.has(key)}"><span class="no">${k + 1}</span><span class="tx">${esc(s.text)}</span><span class="tm"><b>${minTxt(n(s.min))}</b>${mmss(a)}–${mmss(b)}</span></button></li>`;
    }).join('')}</ol></section>` : '<div class="empty">주문 후 조리 순서가 없습니다. 편집에서 추가하세요.</div>'}`;
}

/* ===== 4. 공통 UI ===== */
function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 1800); }
function ask(title, msg, okLabel, cb, safe = false) {
  $('sh-t').textContent = title; $('sh-m').textContent = msg; $('sh-ok').textContent = okLabel;
  $('sh-ok').classList.toggle('safe', safe); state.sheetCb = cb; $('scrim').hidden = false; $('sh-ok').focus();
}
function closeSheet() { $('scrim').hidden = true; state.sheetCb = null; }
function go(view, extra = {}) { Object.assign(state, { view }, extra); render(); window.scrollTo(0, 0); }
function openDetail(id) {
  const r = find(id);
  go('detail', { id, phase: 'prep', batch: n(r.prepBatch) || 10, orders: 1, checked: new Set() });
}
function blank() {
  return { id: uid(), name: '', category: '안주', yieldUnit: '접시', salePrice: '', targetMin: '', prepBatch: 10, prepStorage: '',
    ingredients: [{ stage:'prep', name:'', qty:'', unit:'g', buyQty:'', buyPrice:'' }, { stage:'service', name:'', qty:'', unit:'g', buyQty:'', buyPrice:'' }],
    prepSteps: [''], serviceSteps: [st('', '')], memo: '', updatedAt: '' };
}
function openEdit(r) { state.editFrom = r ? r.id : null; state.draft = r ? JSON.parse(JSON.stringify(r)) : blank(); go('edit'); }
function saveDraft() {
  const d = state.draft;
  d.name = d.name.trim();
  if (!d.name) { const e = $('err'); e.textContent = '메뉴 이름을 입력해 주세요.'; e.hidden = false; $('f-name').focus(); return; }
  d.ingredients = d.ingredients.filter(i => String(i.name).trim()).map(i => ({ ...i, name: i.name.trim(), qty: n(i.qty), buyQty: n(i.buyQty), buyPrice: n(i.buyPrice) }));
  d.prepSteps = d.prepSteps.map(s => s.trim()).filter(Boolean);
  d.serviceSteps = d.serviceSteps.map(s => ({ text: s.text.trim(), min: n(s.min) })).filter(s => s.text);
  d.salePrice = n(d.salePrice); d.targetMin = n(d.targetMin) || ''; d.prepBatch = n(d.prepBatch) || 10;
  d.updatedAt = today();
  const k = db.recipes.findIndex(r => r.id === d.id);
  const prev = db.recipes.slice();
  if (k >= 0) db.recipes[k] = d; else db.recipes.push(d);
  if (!save()) { db.recipes = prev; toast('저장 공간이 가득 찼습니다. 다른 메뉴 사진을 지우고 다시 저장해 주세요.'); return; }
  state.draft = null; openDetail(d.id); toast('저장했습니다');
}
function restore(text) {
  let data;
  try { data = JSON.parse(text); } catch (e) { toast('백업 형식이 아닙니다. 복사한 내용을 그대로 붙여넣어 주세요.'); return; }
  if (!data || !Array.isArray(data.recipes)) { toast('메뉴 목록을 찾지 못했습니다.'); return; }
  ask('백업으로 복원할까요?', `지금 메뉴 ${db.recipes.length}개가 백업의 메뉴 ${data.recipes.length}개로 바뀝니다.`, '복원', () => {
    db = normalize(data); save(); go('settings'); toast('복원했습니다');
  }, true);
}

/* 주문 타이머: 1초마다 조리 영역만 다시 그림 */
let tick = null;
function startTimer(id) {
  state.timer = { id, start: Date.now() };
  [...state.checked].filter(k => k[0] === 's').forEach(k => state.checked.delete(k));
  clearInterval(tick);
  tick = setInterval(() => {
    const r = state.timer && find(state.timer.id);
    if (!r) { clearInterval(tick); return; }
    if (state.view === 'detail' && state.id === r.id && state.phase === 'service' && $('svc-live')) $('svc-live').innerHTML = svcLiveHTML(r);
  }, 1000);
}
function stopTimer() { state.timer = null; clearInterval(tick); }

/* ===== 5. 이벤트 ===== */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, d = state.draft;
  switch (a) {
    case 'skipSplash': hideSplash(); break;
    case 'tab': state.draft = null; state.tab = t.dataset.tab; state.q = ''; state.cat = '전체'; go(state.tab); break;
    case 'cat': state.cat = t.dataset.cat; render(); break;
    case 'open': openDetail(t.dataset.id); break;
    case 'back':
      if (state.view === 'edit') { state.draft = null; state.editFrom ? go('detail', { id: state.editFrom }) : go(state.tab); }
      else go(state.tab);
      break;
    case 'phase': state.phase = t.dataset.p; render(); break;
    case 'batch': state.batch = parseFloat(t.dataset.x); render(); break;
    case 'orders': state.orders = parseFloat(t.dataset.x); render(); break;
    case 'step': { const k = t.dataset.k; state.checked.has(k) ? state.checked.delete(k) : state.checked.add(k); render(); break; }
    case 'timerStart': startTimer(state.id); render(); break;
    case 'timerStop': stopTimer(); render(); toast('타이머를 멈췄습니다'); break;
    case 'new': openEdit(null); break;
    case 'edit': openEdit(find(state.id)); break;
    case 'dup': { const r = find(state.id); const c = JSON.parse(JSON.stringify(r)); c.id = uid(); c.name = r.name + ' (복사)'; state.editFrom = null; state.draft = c; go('edit'); break; }
    case 'del': {
      const r = find(state.id);
      ask(`'${r.name}' 삭제`, '삭제한 메뉴는 되돌릴 수 없습니다.', '삭제', () => { db.recipes = db.recipes.filter(x => x.id !== r.id); save(); go('list', { tab: 'list' }); toast('삭제했습니다'); });
      break;
    }
    case 'addIng': d.ingredients.push({ stage: t.dataset.stage, name:'', qty:'', unit:'g', buyQty:'', buyPrice:'' }); render(); $('ing-' + (d.ingredients.length - 1) + '-name').focus(); break;
    case 'rmIng': d.ingredients.splice(+t.dataset.k, 1); render(); break;
    case 'addPrepStep': d.prepSteps.push(''); render(); $('ps-' + (d.prepSteps.length - 1)).focus(); break;
    case 'rmPrepStep': d.prepSteps.splice(+t.dataset.k, 1); render(); break;
    case 'addSvcStep': d.serviceSteps.push(st('', '')); render(); $('ss-' + (d.serviceSteps.length - 1)).focus(); break;
    case 'rmSvcStep': d.serviceSteps.splice(+t.dataset.k, 1); render(); break;
    case 'save': saveDraft(); break;
    case 'saveBackup': {
      const text = JSON.stringify(db), bk = $('bk');
      const fallback = () => { bk.hidden = false; bk.value = text; bk.focus(); bk.select(); toast('아래 내용을 길게 눌러 복사해 주세요.'); };
      if (!inFrame()) {
        const name = `레시피노트_백업_${today()}.json`;
        try {
          const file = new File([text], name, { type: 'application/json' });
          if (isIOS() && navigator.canShare && navigator.canShare({ files: [file] })) {
            navigator.share({ files: [file], title: '레시피노트 백업' }).then(() => toast('공유 창에서 "파일에 저장"을 고르면 아이폰에 보관됩니다.')).catch(() => {});
            break;
          }
        } catch (err) {}
        try {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
          a.download = name;
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(a.href), 2000);
          toast('백업 파일을 저장했습니다'); break;
        } catch (err) { fallback(); break; }
      }
      try { navigator.clipboard.writeText(text).then(() => toast('미리보기 화면이라 파일 대신 내용을 복사했습니다.')).catch(fallback); } catch (err) { fallback(); }
      break;
    }
    case 'rmPhoto': delete state.draft.photo; render(); break;
    case 'install': if (installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; render(); }); } break;
    case 'importText': restore($('imp').value); break;
    case 'clearSamples': ask('예시 메뉴 지우기', '처음 들어 있던 예시 5개를 지웁니다. 직접 등록한 메뉴는 그대로 둡니다.', '지우기', () => {
      db.recipes = db.recipes.filter(r => !/^s-\d+$/.test(r.id)); db.sample = false; save(); go('settings'); toast('예시를 지웠습니다'); }); break;
    case 'reset': ask('모든 메뉴 삭제', `메뉴 ${db.recipes.length}개를 모두 지웁니다. 백업을 먼저 해 두셨나요?`, '모두 삭제', () => { db.recipes = []; db.sample = false; save(); go('settings'); toast('모두 삭제했습니다'); }); break;
    case 'sheetOk': { const cb = state.sheetCb; closeSheet(); cb && cb(); break; }
    case 'sheetCancel': closeSheet(); break;
  }
});
$('scrim').addEventListener('click', e => { if (e.target.id === 'scrim') closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('scrim').hidden) closeSheet(); });
document.addEventListener('submit', e => { e.preventDefault(); if (state.view === 'edit') saveDraft(); });

document.addEventListener('input', e => {
  const el = e.target, ds = el.dataset;
  if (el.id === 'q') { state.q = el.value; $('list').innerHTML = listHTML(); return; }
  if (ds.set) { db.settings[ds.set] = ds.set === 'target' ? n(el.value) : el.value; save(); return; }
  const d = state.draft; if (!d) return;
  if (ds.f) d[ds.f] = el.value;
  else if (ds.i != null) {
    const k = +ds.i, i = d.ingredients[k];
    i[ds.k] = el.value;
    if (ds.k === 'unit') el.closest('.ing-ed').querySelector('.u').textContent = el.value;
    $('ing-' + k + '-out').textContent = won(ingCost(i));
  }
  else if (ds.ps != null) d.prepSteps[+ds.ps] = el.value;
  else if (ds.ss != null) d.serviceSteps[+ds.ss].text = el.value;
  else if (ds.sm != null) d.serviceSteps[+ds.sm].min = el.value;
  updateLive();
});
document.addEventListener('change', e => {
  if (e.target.id === 'ph-file' && e.target.files[0] && state.draft) {
    const f = e.target.files[0]; e.target.value = '';
    toast('사진을 줄이는 중…');
    resizeImage(f).then(url => { state.draft.photo = url; render(); toast('사진을 넣었습니다. 저장을 눌러 주세요.'); })
      .catch(() => toast('사진을 읽지 못했습니다. JPG나 PNG 사진으로 다시 골라 주세요.'));
    return;
  }
  if (e.target.id !== 'bkfile' || !e.target.files[0]) return;
  const fr = new FileReader(); fr.onload = () => restore(fr.result); fr.readAsText(e.target.files[0]); e.target.value = '';
});

/* ===== 앱 설치 (아이폰: 사파리 '홈 화면에 추가' / 안드로이드: 설치 버튼) ===== */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (state.view === 'settings') render(); });
window.addEventListener('appinstalled', () => { installEvt = null; toast('앱으로 설치했습니다'); if (state.view === 'settings') render(); });
const isStandalone = () => window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const inFrame = () => { try { return window.self !== window.top; } catch (e) { return true; } };
const SHARE_ICO = '<span class="ico" aria-label="공유 버튼"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg></span>';
const ADD_ICO = '<span class="ico" aria-label="추가"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg></span>';
const steps = arr => `<ol class="isteps">${arr.map((t, i) => `<li><span class="no">${i + 1}</span><span>${t}</span></li>`).join('')}</ol>`;
function installHTML() {
  let body;
  if (isStandalone()) {
    body = `<div class="okline">${CHECK}앱으로 설치되어 있습니다</div><p class="help" style="margin:0">홈 화면의 레시피노트 아이콘으로 실행하세요.</p>`;
  } else if (installEvt) {
    body = `<button class="btn fill" data-act="install">레시피노트 앱 설치하기</button><p class="help" style="margin:0">설치하면 홈 화면에 아이콘이 생기고, 인터넷이 없어도 열립니다.</p>`;
  } else {
    const ios = steps([
      `<b>사파리</b>로 이 앱 주소를 엽니다. (카톡·네이버 앱 안에서 열었다면 오른쪽 아래 메뉴에서 '사파리로 열기')`,
      `화면 아래쪽 공유 버튼 ${SHARE_ICO} 을 누릅니다.`,
      `메뉴를 아래로 내려 ${ADD_ICO} <b>홈 화면에 추가</b>를 누릅니다.`,
      `이름이 '레시피노트'인지 확인하고 오른쪽 위 <b>추가</b>를 누릅니다.`,
      `홈 화면에 생긴 붉은 달 아이콘으로 실행하면 앱처럼 전체 화면으로 열립니다.`]);
    const other = steps([`크롬 오른쪽 위 메뉴 <b>⋮</b> 를 누릅니다.`, `<b>앱 설치</b> 또는 <b>홈 화면에 추가</b>를 누릅니다.`, `홈 화면 아이콘으로 실행합니다.`]);
    body = `${inFrame() ? '<p class="warnbox">지금은 Claude 미리보기 화면이라 설치할 수 없습니다. 인터넷 주소로 올린 앱을 아이폰 사파리에서 열고 아래 순서대로 하세요.</p>' : ''}
      <div class="flabel">아이폰</div>${ios}
      ${isIOS() ? '' : `<div class="flabel" style="margin-top:4px">안드로이드</div>${other}`}`;
  }
  return `<section class="card" id="install">
    <h2 style="font-size:16px">앱으로 설치</h2>
    ${body}
    <p class="warnbox">아이폰은 사파리와 설치한 앱의 저장 공간이 따로입니다. 사파리에서 적어 둔 레시피가 있으면 <b>백업 내용 저장하기</b> → 설치한 앱에서 <b>백업 파일 불러오기</b>로 옮기세요.</p>
  </section>`;
}
if ('serviceWorker' in navigator && location.protocol === 'https:' && !inFrame()) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

/* 사진: 긴 변 900px, JPEG로 줄여서 저장 (한 장 약 80~150KB) */
function resizeImage(file, max = 900, q = 0.72) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', q));
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

/* ===== 6. 시작 표지: 1.5초 → 표지 넘김(0.95초) ===== */
function hideSplash() {
  const sp = $('splash'); if (!sp || sp.classList.contains('turn')) return;
  document.body.classList.remove('booting');
  sp.classList.add('turn'); sp.style.pointerEvents = 'none';
  setTimeout(() => sp.remove(), 1000);
}
requestAnimationFrame(() => $('splash') && $('splash').classList.add('ready'));
setTimeout(hideSplash, 2000);

render();
</script>
